  :root {
    --paper:  #fdfdfa;
    --sunken: #efefe9;
    --line:   #dcdcd3;
    --line-2: #bcbcb2;
    --text:   #111111;
    --muted:  #6f6f68;
    --accent: #3a3a3a;
    --mono:   "Input Mono", "Roboto Mono", Menlo, "DejaVu Sans Mono", "SF Mono", ui-monospace, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font: 12px/1.45 var(--mono);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  .head { flex: 0 0 auto; text-align: center; padding: 18px 16px 4px; }
  .head h1 {
    margin: 0;
    font-size: clamp(18px, 2.1vw, 24px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .head p { margin: 3px 0 0; font-size: clamp(11px, 1.15vw, 14px); color: #222; }

  .page { flex: 1 1 0; min-height: 0; display: flex; justify-content: center; align-items: center; container-type: size; }
  .stage {
    position: relative;
    flex: 0 0 auto;
    width: min(100cqw, calc(100cqh * 720 / 814.3));
    height: min(100cqh, calc(100cqw * 814.3 / 720));
  }
  .mapbox { position: absolute; inset: 0; }
  svg#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  svg#map.panning { cursor: grabbing; }

  #ripples use { fill: none; stroke-linejoin: round; }
  #ripples .rl { stroke: #c4c8cb; stroke-linecap: butt; }
  #ripples .rp { stroke: var(--paper); stroke-linecap: square; }

  path.district { stroke: var(--paper); stroke-width: 0.7; cursor: pointer; }
  path.district:hover { opacity: .78; }
  path.district.sel { stroke: var(--text); stroke-width: 2; }
  #labels { font-family: var(--mono); }
  .lbl {
    font-size: inherit;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke-linejoin: round;
  }

  .panel {
    position: absolute; z-index: 4;
    top: 5%; right: 4%;
    width: 31em;
    font-size: 10px; line-height: 1.4;
    color: #1d1d1d;
    background: var(--paper);
    padding: 0.5em 0.7em 0.7em;
    border-radius: 4px;
  }
  .row { display: grid; grid-template-columns: 5em minmax(0, 1fr); column-gap: 0.55em; align-items: start; margin-top: 0.45em; }
  .row > label {
    color: var(--muted);
    font-size: 0.86em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding-top: 0.4em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.32em; }
  .chips button {
    background: var(--paper);
    border: 1px solid var(--line-2);
    border-radius: 3px;
    padding: 0.14em 0.55em;
    color: #333;
    font: inherit;
    font-size: 0.9em;
    line-height: 1.5;
    text-shadow: none;
    cursor: pointer;
  }
  .chips button:hover { border-color: #555; color: var(--text); }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }

  .colornote { margin-top: 0.6em; color: var(--muted); font-size: 0.82em; line-height: 1.4; }
  .tally { margin-top: 0.8em; font-size: 0.95em; color: var(--muted); }
  .tally b { color: var(--text); font-weight: 700; }
  .tally span { font-size: 0.95em; }
  .tally .reset { font-size: 0.95em !important; }
  .tally .reset[hidden] { display: inline-block; visibility: hidden; }
  .tally .reset, .wheelbox button {
    background: none; border: 0; padding: 0; margin-top: 2px;
    color: var(--text); font: inherit; font-size: 10.5px;
    cursor: pointer; text-decoration: underline; text-shadow: inherit;
  }

  .leftui {
    position: absolute; left: 1.5%; bottom: 1.5%; z-index: 4;
    display: flex; flex-direction: column; align-items: flex-start; gap: 0.9em;
    font-size: 11px;
    background: var(--paper);
    padding: 0.6em 0.7em;
    border-radius: 4px;
  }
  .wheelbox { width: 11.5em; text-align: center; }
  .wheelbox label {
    display: block;
    color: var(--muted);
    font-size: 0.86em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
  .wheelbox button { height: 1.45em; margin-top: 2px; font-size: 0.95em; }
  .wheelbox button[hidden] { display: block; visibility: hidden; }
  svg#wheel { display: block; width: 11.5em; height: 11.5em; text-shadow: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  path.wcell { stroke: var(--paper); stroke-width: 0.35; cursor: pointer; }
  path.wcell:hover { stroke: var(--text); stroke-width: 1.4; }
  path.wcell.empty { opacity: .40; pointer-events: none; }
  #wheelSel { pointer-events: none; }
  #wheelSel path { fill: none; stroke: var(--text); stroke-width: 2; }
  circle.hub { fill: #2d3a4a; cursor: pointer; }
  circle.hub:hover { fill: #000; }

  .zoomui {
    display: flex; flex-direction: row; align-items: center; gap: 0.7em;
  }
  .zbtns { display: flex; flex-direction: row; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; background: var(--paper); }
  .zbtns button {
    width: 2.8em; height: 2.1em;
    background: var(--paper); border: 0; color: var(--text);
    font: inherit; font-size: 1.25em; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .zbtns button + button { border-left: 1px solid var(--line); }
  .zbtns button:hover { background: var(--sunken); }
  .zbtns button.rst { font-size: 0.82em; width: 4.2em; height: auto; align-self: stretch; }
  .zlvl { text-align: center; font-size: 0.9em; color: var(--muted); }

  .maphint {
    max-width: 14.5em; line-height: 1.35;
    font-size: 0.9em; color: var(--muted);
  }

  #detail {
    position: absolute; z-index: 6;
    left: 0; top: 0;
    width: min(380px, calc(100% - 16px));
    background: var(--paper);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    box-shadow: 0 6px 22px #0000001f;
    padding: 14px 14px 12px;
  }
  #detail[hidden] { display: none; }
  #detail::after {
    content: ""; display: none;
    position: absolute; left: var(--ax, 50%);
    width: 14px; height: 14px;
    background: var(--paper);
    border: 1px solid var(--line-2);
    transform: translateX(-50%) rotate(45deg);
  }
  #detail[data-side="above"]::after { display: block; bottom: -8px; border-top: 0; border-left: 0; }
  #detail[data-side="below"]::after { display: block; top: -8px; border-bottom: 0; border-right: 0; }

  .cardtitle { text-align: center; margin-bottom: 10px; }
  .cardtitle span { display: inline-block; font-weight: 700; font-size: 15px; line-height: 1.1; }
  .cardclose {
    position: absolute; top: 10px; right: 14px;
    background: none; border: 0; padding: 0;
    color: var(--muted); font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .cardclose:hover { color: var(--text); }

  .crows {
    display: grid;
    grid-template-columns: fit-content(180px) minmax(0, 1fr);
    column-gap: 12px;
    row-gap: 8px;
    align-items: center;
  }
  .crow { display: contents; }
  .crow.off > * { opacity: .42; }
  .cwho { text-align: right; min-width: 0; }
  .cname { font-size: 11.5px; font-weight: 700; color: #222; line-height: 1.2; overflow-wrap: anywhere; }
  .cname a { color: inherit; font-size: inherit; text-decoration: none; }
  .cname a:hover { text-decoration: underline; }
  .cparty { font-size: 10.5px; color: #555; line-height: 1.2; }
  .cparty small { font-size: 9.5px; color: #8a8a82; }

  .barcol { min-width: 0; }
  .bar {
    height: 32px;
    border-radius: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1.15;
    overflow: hidden; cursor: default; outline: none;
  }
  .bar .tip { text-align: center; white-space: nowrap; pointer-events: none; }
  .bar .tip b { font-size: 11px; }
  .bar.nocolor { background: var(--sunken); color: var(--muted); border: 1px dashed var(--line-2); }

  .seclink {
    display: block; margin: 8px auto 0;
    background: none; border: 0; padding: 0;
    color: #555; font: inherit; font-size: 11px;
    text-decoration: underline; cursor: pointer;
  }
  .seclink:hover { color: var(--text); }
  .cardnote { text-align: center; margin-top: 6px; font-size: 10px; color: #8a8a82; }
  .none { color: var(--muted); }
  a { color: var(--text); text-decoration: none; font-size: 11px; }

  @media (max-width: 700px) {
    .head { padding: 10px 12px 2px; }
    .head h1 { font-size: 17px; }
    .head p { font-size: 10.5px; }
    #detail { width: min(310px, calc(100% - 16px)); padding: 10px 10px 8px; }
    .cardtitle { margin-bottom: 7px; }
    .cardtitle span { font-size: 13px; }
    .crows { grid-template-columns: fit-content(130px) minmax(0, 1fr); column-gap: 9px; row-gap: 6px; }
    .cname { font-size: 10.5px; }
    .cparty { font-size: 9.5px; }
    .bar { height: 28px; }
  }

  @media (max-width: 520px) {
    body { overflow: auto; }
    .page { display: block; flex: 0 0 auto; container-type: normal; }
    .stage { width: 100%; height: auto; }
    .mapbox { position: relative; inset: auto; aspect-ratio: 720 / 814.3; }
    .panel { position: static; width: auto; padding: 4px 16px 20px; max-width: 420px; margin: 0 auto; font-size: 11px !important; }
    .leftui { position: static; padding: 0 16px 24px; max-width: 420px; margin: 0 auto; font-size: 11px !important; }
  }
</style>

<header class="head">
  <h1>California congressional map, by color</h1>
  <p>Which colors did the winning campaigns run in each district?</p>
</header>

<div class="page">
  <div class="stage">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 720 814.3" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Map of California congressional districts colored by campaign brand colors">
        <defs id="defs"></defs>
        <g id="viewport">
          <g id="ripples"></g>
          <g id="shapes"></g>
          <g id="labels"></g>
        </g>
      </svg>
      <div id="detail" hidden></div>
    </div>

    <div class="panel">
      <div class="row"><label>Party</label>
        <div class="chips" id="partyChips">
          <button data-k="any">Any</button>
          <button data-k="D">Democrat</button>
          <button data-k="R">Republican</button>
          <button data-k="O">Other</button>
        </div>
      </div>

      <div class="row"><label>Gender</label>
        <div class="chips" id="genderChips">
          <button data-k="any">Any</button>
          <button data-k="F">Women</button>
          <button data-k="M">Men</button>
        </div>
      </div>

      <div class="row"><label>Status</label>
        <div class="chips" id="statusChips">
          <button data-k="any">Any</button>
          <button data-k="inc">Incumbents</button>
          <button data-k="chal">Challengers</button>
        </div>
      </div>

      <div class="row"><label>Fill</label>
        <div class="chips" id="modeSeg">
          <button data-mode="winner">Winner</button>
          <button data-mode="loser">Loser</button>
          <button data-mode="split">Winner + loser</button>
        </div>
      </div>

      <div class="row"><label>Color</label>
        <div class="chips" id="slotSeg">
          <button data-slot="p">Primary</button>
          <button data-slot="s">Secondary</button>
        </div>
      </div>

      <div class="tally" id="tally"></div>
      <div class="colornote">*Primary and secondary colors were determined by saturation, not necessarily by which color is most prevalent on website.</div>
    </div>

    <div class="leftui">
      <div class="wheelbox">
        <label>Color wheel</label>
        <svg id="wheel" viewBox="-104 -104 208 208" role="group"
             aria-label="Color wheel: pick a shade to find districts using it">
          <g id="wheelCells"></g>
          <g id="wheelSel"></g>
          <circle class="hub" id="wheelHub" cx="0" cy="0" r="11"><title>Clear color picks</title></circle>
        </svg>
        <button id="wheelClear" hidden>reset</button>
      </div>

      <div class="row" style="margin-top:0"><label>Labels</label>
        <div class="chips" id="lblSeg">
          <button data-lbl="on">On</button>
          <button data-lbl="off">Off</button>
        </div>
      </div>

      <div class="zoomui">
        <div class="zbtns">
          <button id="zIn"  title="Zoom in"  aria-label="Zoom in">+</button>
          <button id="zOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button id="zRst" class="rst" title="Reset view" aria-label="Reset view">reset</button>
        </div>
        <div class="zlvl" id="zoomLvl">1.0&times;</div>
      </div>
      <div class="maphint">Scroll to zoom &middot; drag to pan &middot; double-click to zoom in</div>
    </div>
  </div>
</div>

const partyKey = c => (c.party === "Democratic" ? "D" : c.party === "Republican" ? "R" : "O");
const statusKey = c => (c.incumbent ? "inc" : "chal");

function matches(c) {
  const f = filters;
  if (f.party.size  && !f.party.has(partyKey(c)))   return false;
  if (f.gender.size && !(c.g && f.gender.has(c.g))) return false;
  if (f.status.size && !f.status.has(statusKey(c))) return false;
  if (f.cells.size && !schemeCells(c).some(k => f.cells.has(k))) return false;
  return true;
}

const matchedIn = d => (DATA[d] || []).filter(matches);

const winnerOf = d => (DATA[d] || [])[0] || null;
const loserOf  = d => (DATA[d] || [])[1] || null;
const resultOf = c => (c.won ? "winner" : "loser");

function roleCandidate(d) {
  const c = state.mode === "loser" ? loserOf(d) : winnerOf(d);
  return c && matches(c) ? c : null;
}

const anyFilter = () => filters.party.size || filters.gender.size ||
                        filters.status.size || filters.cells.size;


function colorOf(cand, slot) {
  if (!cand) return null;
  const other = slot === "p" ? "s" : "p";
  if (filters.cells.size && cand[other] && filters.cells.has(cellOf(cand[other])) &&
      !(cand[slot] && filters.cells.has(cellOf(cand[slot])))) return cand[other];
  return cand[slot] || cand[other] || null;
}

function luma(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(n >> 16 & 255) + 0.7152 * f(n >> 8 & 255) + 0.0722 * f(n & 255);
}
const ink = hex => (hex && luma(hex) > 0.45 ? "#000000" : "#ffffff");


const SECTORS = 12, RINGS = 5;
const L_MAX = 0.8;
const R_HUB = 13, R_RIM = 99;

const HUE_NAMES = [
  "red", "orange", "yellow", "lime",
  "green", "teal", "cyan", "azure",
  "blue", "violet", "magenta", "pink"
];
const RING_NAMES = ["near-black", "dark", "mid", "light", "pale"];

function toHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  let h = 0;
  if (d) {
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0)
      : mx === g ? (b - r) / d + 2
      :            (r - g) / d + 4;
    h *= 60;
  }
  return { h, s: d ? d / (1 - Math.abs(2 * l - 1)) : 0, l };
}

function cellOf(hex) {
  const c = toHsl(hex);
  const sec = Math.floor(c.h / (360 / SECTORS)) % SECTORS;
  return sec + "," + Math.min(RINGS - 1, Math.floor(c.l / L_MAX * RINGS));
}

const schemeCells = c => [c.p, c.s].filter(Boolean).map(cellOf);

function cellName(key) {
  const [sec, ring] = key.split(",").map(Number);
  return RING_NAMES[ring] + " " + HUE_NAMES[sec];
}

function cellPath(sec, ring) {
  const step = 360 / SECTORS;
  const a0 = (sec * step - 150) * Math.PI / 180;
  const a1 = ((sec + 1) * step - 150) * Math.PI / 180;
  const r0 = R_HUB + (R_RIM - R_HUB) * (ring / RINGS);
  const r1 = R_HUB + (R_RIM - R_HUB) * ((ring + 1) / RINGS);
  const p = (r, a) => `${(r * Math.cos(a)).toFixed(2)} ${(r * Math.sin(a)).toFixed(2)}`;
  return `M${p(r0, a0)}A${r0} ${r0} 0 0 1 ${p(r0, a1)}` +
         `L${p(r1, a1)}A${r1} ${r1} 0 0 0 ${p(r1, a0)}Z`;
}

function cellFill(sec, ring) {
  const h = (sec + 0.5) * (360 / SECTORS);
  const l = 0.14 + 0.58 * (ring / (RINGS - 1));
  const s = 0.90 - 0.35 * Math.abs(2 * l - 1);
  return `hsl(${h.toFixed(1)}, ${(s * 100).toFixed(0)}%, ${(l * 100).toFixed(0)}%)`;
}

const CELL_COUNT = {};
Object.keys(DATA).forEach(d => DATA[d].forEach(c => schemeCells(c).forEach(k => {
  CELL_COUNT[k] = (CELL_COUNT[k] || 0) + 1;
})));

function buildWheel() {
  const cells = [];
  for (let ring = 0; ring < RINGS; ring++) {
    for (let sec = 0; sec < SECTORS; sec++) {
      const key = sec + "," + ring;
      const n = CELL_COUNT[key] || 0;
      const title = n
        ? `${cellName(key)} — ${n} campaign color${n === 1 ? "" : "s"}`
        : `${cellName(key)} — unused`;
      cells.push(
        `<path class="wcell${n ? "" : " empty"}" d="${cellPath(sec, ring)}" ` +
        `fill="${cellFill(sec, ring)}" data-c="${key}"><title>${title}</title></path>`
      );
    }
  }
  document.getElementById("wheelCells").innerHTML = cells.join("");
}

function paintWheel() {
  document.getElementById("wheelSel").innerHTML = [...filters.cells].map(key => {
    const [sec, ring] = key.split(",").map(Number);
    return `<path d="${cellPath(sec, ring)}"/>`;
  }).join("");

  document.getElementById("wheelClear").hidden = !filters.cells.size;
}

function clearWheel() {
  filters.cells.clear();
  render();
  renderDetail();
}

const wheelEl = document.getElementById("wheel");
let wheelDrag = null;

function cellUnder(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest("path.wcell") : null;
}

function paintCell(cell) {
  const key = cell.dataset.c;
  if (filters.cells.has(key) === wheelDrag.add) return;
  if (wheelDrag.add) filters.cells.add(key);
  else filters.cells.delete(key);
  render();
  renderDetail();
}

wheelEl.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const cell = cellUnder(e.clientX, e.clientY);
  if (!cell) return;
  e.preventDefault();
  wheelDrag = { id: e.pointerId, add: !filters.cells.has(cell.dataset.c) };
  try { wheelEl.setPointerCapture(e.pointerId); } catch (_) { }
  paintCell(cell);
});

wheelEl.addEventListener("pointermove", e => {
  if (!wheelDrag || e.pointerId !== wheelDrag.id) return;
  const cell = cellUnder(e.clientX, e.clientY);
  if (cell) paintCell(cell);
});

function endWheelDrag(e) {
  if (!wheelDrag || e.pointerId !== wheelDrag.id) return;
  try { wheelEl.releasePointerCapture(e.pointerId); } catch (_) { }
  wheelDrag = null;
}
wheelEl.addEventListener("pointerup", endWheelDrag);
wheelEl.addEventListener("pointercancel", endWheelDrag);

document.getElementById("wheelHub").addEventListener("click", clearWheel);
document.getElementById("wheelClear").addEventListener("click", clearWheel);


function render() {
  const defs = [], shapes = [], labels = [];

  districts.forEach(d => {
    const sh = SHAPES[d];
    const hits = matchedIn(d);
    let fill = EMPTY, labelInk = ink(EMPTY);

    if (state.mode === "split" && hits.length >= 2) {
      const cols = hits.slice(0, 2).map(c => colorOf(c, state.slot) || EMPTY);
      if (cols[0] !== cols[1]) {
        const id = `g${d}`;
        defs.push(
          `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">` +
          `<stop offset="50%" stop-color="${cols[0]}"/>` +
          `<stop offset="50%" stop-color="${cols[1]}"/></linearGradient>`
        );
        fill = `url(#${id})`;
      } else {
        fill = cols[0];
      }
      labelInk = ink(cols[0]);
    } else if (state.mode === "split") {
      const c = colorOf(hits[0], state.slot);
      if (c) { fill = c; labelInk = ink(c); }
    } else {
      const c = colorOf(roleCandidate(d), state.slot);
      if (c) { fill = c; labelInk = ink(c); }
    }

    const pickedName = state.mode === "loser" ? "Loser" : "Winner";
    const title = !hits.length
      ? `District ${d} — no candidate matches the filters`
      : state.mode === "split"
        ? `District ${d} — ` + hits.map(c => `${c.name} (${resultOf(c)})`).join(", ")
        : roleCandidate(d)
          ? `District ${d} — ${pickedName}: ${roleCandidate(d).name}`
          : `District ${d} — the ${pickedName.toLowerCase()} doesn't match the filters`;

    shapes.push(
      `<path class="district${state.sel === d ? " sel" : ""}" d="${sh.d}" fill="${fill}" ` +
      `vector-effect="non-scaling-stroke" data-d="${d}"><title>${title}</title></path>`
    );
    if (state.labels === "on") {
      const halo = labelInk === "#ffffff" ? "#00000055" : "#ffffffaa";
      labels.push(`<text class="lbl" x="${sh.cx}" y="${sh.cy}" dy="0.35em" ` +
                  `fill="${labelInk}" stroke="${halo}">${d}</text>`);
    }
  });

  document.getElementById("defs").innerHTML = defs.join("");
  document.getElementById("shapes").innerHTML = shapes.join("");
  document.getElementById("labels").innerHTML = labels.join("");
  syncButtons();
  renderTally();
  paintWheel();
  fitPanel();
}

function syncButtons() {
  const groups = [["partyChips", "party"], ["genderChips", "gender"], ["statusChips", "status"]];
  groups.forEach(([id, key]) => {
    const set = filters[key];
    document.querySelectorAll(`#${id} button`).forEach(b => {
      const on = b.dataset.k === "any" ? set.size === 0 : set.has(b.dataset.k);
      b.setAttribute("aria-pressed", on);
    });
  });
  document.querySelectorAll("#modeSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  document.querySelectorAll("#slotSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.slot === state.slot));
  document.querySelectorAll("#lblSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lbl === state.labels));
}

function filterLabel() {
  const names = {
    D: "Democrat", R: "Republican", O: "other party",
    F: "women", M: "men", inc: "incumbents", chal: "challengers"
  };
  const parts = ["party", "gender", "status"]
    .map(k => [...filters[k]].map(v => names[v]).join(" or "))
    .filter(Boolean);
  if (filters.cells.size) {
    parts.push("using " + [...filters.cells].map(cellName).join(" or "));
  }
  return parts.length ? parts.join(", ") : "all candidates";
}

function renderTally() {
  let cands = 0, hitDistricts = 0;
  districts.forEach(d => {
    const n = matchedIn(d).length;
    cands += n;
    if (n) hitDistricts += 1;
  });
  const total = districts.reduce((a, d) => a + (DATA[d] || []).length, 0);

  document.getElementById("tally").innerHTML =
    `showing <b>${cands}</b> of ${total} candidates &middot; <b>${hitDistricts}</b> of ` +
    `${districts.length} districts` +
    `<br><button class="reset" id="resetFilters"${anyFilter() ? "" : " hidden"}>clear filters</button>`;

  const rf = document.getElementById("resetFilters");
  if (rf) rf.addEventListener("click", () => {
    filters = noFilters();
    render();
    renderDetail();
  });
}


const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function applyView() {
  view.k = clamp(view.k, MIN_K, MAX_K);
  view.x = clamp(view.x, W * (1 - view.k), 0);
  view.y = clamp(view.y, H * (1 - view.k), 0);

  vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);

  const lbl = document.getElementById("labels");
  lbl.style.fontSize = (LBL_SIZE / view.k) + "px";
  lbl.style.strokeWidth = (LBL_HALO / view.k) + "px";

  updateRipples();

  document.getElementById("zoomLvl").innerHTML = view.k.toFixed(1) + "&times;";
  positionCallout();
}

function updateRipples() {
  const s = svg.getScreenCTM().a;
  const hair = 0.7 / (view.k * s);
  document.querySelectorAll("#ripples use").forEach(el => {
    const w = 2 * RIPPLE_PX[el.dataset.i] / (view.k * s);
    el.setAttribute("stroke-width", el.classList.contains("rl") ? w : Math.max(0, w - 2 * hair));
  });
}
window.addEventListener("resize", updateRipples);

function positionCallout() {
  const box = document.getElementById("detail");
  if (!box || box.hidden || state.sel == null || !SHAPES[state.sel]) return;
  const sh = SHAPES[state.sel];
  const stage = box.parentElement.getBoundingClientRect();

  const pt = svg.createSVGPoint();
  pt.x = view.x + sh.cx * view.k;
  pt.y = view.y + sh.cy * view.k;
  const s = pt.matrixTransform(svg.getScreenCTM());
  const px = s.x - stage.left, py = s.y - stage.top;

  const bw = box.offsetWidth, bh = box.offsetHeight, gap = 14, edge = 8;
  const roomAbove = py - gap - edge, roomBelow = stage.height - py - gap - edge;
  const above = roomAbove >= bh || roomAbove >= roomBelow;

  let top = above ? py - gap - bh : py + gap;
  const fits = top >= edge && top + bh <= stage.height - edge;
  top = clamp(top, edge, Math.max(edge, stage.height - bh - edge));
  const left = clamp(px - bw / 2, edge, Math.max(edge, stage.width - bw - edge));

  box.style.left = left + "px";
  box.style.top = top + "px";
  box.style.setProperty("--ax", clamp(px - left, 34, bw - 34) + "px");
  box.dataset.side = fits ? (above ? "above" : "below") : "none";
}
window.addEventListener("resize", positionCallout);


function fitPanel() {
  const stage = document.querySelector(".stage");
  const ctm = svg.getScreenCTM();
  const box = stage.getBoundingClientRect();
  const sc = ctm.a, offX = ctm.e - box.left, offY = ctm.f - box.top;
  const GAP = 14, BASE = 11, MIN = 6;

  const rows = el => {
    const top = el.offsetTop, bottom = top + el.offsetHeight;
    return [Math.max(0, Math.floor(((top - offY) / sc) / EDGE_STEP)),
            Math.min(RIGHT.length - 1, Math.floor(((bottom - offY) / sc) / EDGE_STEP))];
  };
  const clearsRight = el => {
    const [a, b] = rows(el);
    let edge = 0;
    for (let i = a; i <= b; i++) edge = Math.max(edge, RIGHT[i]);
    return el.offsetLeft >= offX + edge * sc + GAP;
  };
  const clearsLeft = el => {
    const [a, b] = rows(el);
    let edge = 9999;
    for (let i = a; i <= b; i++) edge = Math.min(edge, LEFT[i]);
    return el.offsetLeft + el.offsetWidth + GAP <= offX + edge * sc;
  };

  [[document.querySelector(".panel"), clearsRight, 10],
   [document.querySelector(".leftui"), clearsLeft, BASE]].forEach(([el, clears, start]) => {
    if (getComputedStyle(el).position !== "absolute") { el.style.fontSize = ""; return; }
    for (let px = start; px >= MIN; px -= 0.25) {
      el.style.fontSize = px + "px";
      if (clears(el)) return;
    }
  });
}
window.addEventListener("resize", fitPanel);

function toUser(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function zoomAt(factor, ux, uy) {
  const k2 = clamp(view.k * factor, MIN_K, MAX_K);
  if (k2 === view.k) return;
  view.x = ux - ((ux - view.x) / view.k) * k2;
  view.y = uy - ((uy - view.y) / view.k) * k2;
  view.k = k2;
  applyView();
}

const zoomCenter = factor => zoomAt(factor, W / 2, H / 2);

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const u = toUser(e.clientX, e.clientY);
  zoomAt(Math.exp(-e.deltaY * 0.0018), u.x, u.y);
}, { passive: false });

svg.addEventListener("dblclick", e => {
  const u = toUser(e.clientX, e.clientY);
  zoomAt(1.8, u.x, u.y);
});

document.getElementById("zIn").addEventListener("click", () => zoomCenter(1.5));
document.getElementById("zOut").addEventListener("click", () => zoomCenter(1 / 1.5));
document.getElementById("zRst").addEventListener("click", () => {
  view = { k: 1, x: 0, y: 0 };
  applyView();
});

const pointers = new Map();
let panStart = null, pinchStart = null;
const TAP_SLOP = 5;
let tap = null;

const districtAt = el => {
  const p = el && el.closest ? el.closest("path.district") : null;
  return p ? Number(p.dataset.d) : null;
};

function grab(id) {
  if (svg.hasPointerCapture && svg.hasPointerCapture(id)) return;
  try { svg.setPointerCapture(id); } catch (_) { }
}

svg.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    const u = toUser(e.clientX, e.clientY);
    panStart = { ux: u.x, uy: u.y, vx: view.x, vy: view.y };
    tap = { id: e.pointerId, x: e.clientX, y: e.clientY, d: districtAt(e.target) };
    svg.classList.add("panning");
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
    panStart = null;
    tap = null;
    pointers.forEach((_v, id) => grab(id));
  }
});

svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (tap && e.pointerId === tap.id &&
      Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > TAP_SLOP) {
    tap = null;
    grab(e.pointerId);
  }

  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = toUser((a.x + b.x) / 2, (a.y + b.y) / 2);
    const target = clamp(pinchStart.k * (dist / pinchStart.dist), MIN_K, MAX_K);
    zoomAt(target / view.k, mid.x, mid.y);
    return;
  }

  if (panStart) {
    const u = toUser(e.clientX, e.clientY);
    view.x = panStart.vx + (u.x - panStart.ux) * view.k;
    view.y = panStart.vy + (u.y - panStart.uy) * view.k;
    applyView();
  }
});

function endPointer(e) {
  try { svg.releasePointerCapture(e.pointerId); } catch (_) { }
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 0) { panStart = null; svg.classList.remove("panning"); }
}

svg.addEventListener("pointerup", e => {
  const pick = tap && e.pointerId === tap.id &&
               Math.hypot(e.clientX - tap.x, e.clientY - tap.y) <= TAP_SLOP
               ? tap.d : null;
  tap = null;
  endPointer(e);
  if (pick != null) select(pick);
});

svg.addEventListener("pointercancel", e => { tap = null; endPointer(e); });


let cardSlot = "p";

const commas = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

function candRow(c, dimmed, topShare) {
  const votes = Number(String(c.votes || "").replace(/[^0-9]/g, ""));
  const hasVotes = Number.isFinite(votes) && votes > 0;
  const pct = c.share != null ? c.share.toFixed(1) + "%" : null;

  const width = c.share != null && topShare > 0
    ? Math.max(42, (c.share / topShare) * 100)
    : 100;

  const hex = c[cardSlot];
  const tip = `<span class="tip">` +
    (pct ? `<b>${pct}</b>` : "") +
    (pct && hasVotes ? "<br>" : "") +
    (hasVotes ? `${commas(votes)} votes` : "") +
    (!pct && !hasVotes ? "no vote data" : "") + `</span>`;

  const bar = hex
    ? `<div class="bar" style="width:${width.toFixed(1)}%;background:${hex};color:${ink(hex)}">${tip}</div>`
    : `<div class="bar nocolor" style="width:${width.toFixed(1)}%"><span class="tip">no ${cardSlot === "s" ? "secondary" : "primary"} color recorded</span></div>`;

  const label = (c.incumbent ? "*" : "") + c.name;
  const nameHtml = /^https?:\/\//i.test(c.site || "")
    ? `<a href="${c.site.replace(/"/g, "%22")}" target="_blank" rel="noopener noreferrer" ` +
      `title="Open ${c.name}'s campaign website">${label}</a>`
    : label;

  return `<div class="crow${dimmed ? " off" : ""}">
    <div class="cwho">
      <div class="cname">${nameHtml}</div>
      <div class="cparty">${c.party}${dimmed ? ` <small>filtered out</small>` : ""}</div>
    </div>
    <div class="barcol">${bar}</div>
  </div>`;
}

function renderDetail() {
  const box = document.getElementById("detail");

  if (state.sel == null) {
    box.hidden = true;
    box.innerHTML = "";
    return;
  }
  box.hidden = false;

  const d = state.sel;
  const all = DATA[d] || [];
  const hitNames = new Set(matchedIn(d).map(c => c.name));

  const topShare = Math.max(0, ...all.map(c => c.share || 0));

  const rows = all.length
    ? `<div class="crows">` + all.map(c => candRow(c, !hitNames.has(c.name), topShare)).join("") + `</div>`
    : `<div class="none">No candidate data.</div>`;

  const note = all.some(c => c.incumbent)
    ? `<div class="cardnote">*Incumbent candidate</div>` : "";

  box.innerHTML =
    `<button class="cardclose" id="clearSel" aria-label="Close">&times;</button>` +
    `<div class="cardtitle"><span>District ${d}</span></div>` +
    rows + note +
    `<button class="seclink" id="slotLink">see ${cardSlot === "p" ? "secondary" : "primary"} color</button>`;

  document.getElementById("slotLink").addEventListener("click", () => {
    cardSlot = cardSlot === "p" ? "s" : "p";
    renderDetail();
  });

  document.getElementById("clearSel").addEventListener("click", () => select(null));
  positionCallout();
}

function select(d) {
  if (d !== state.sel) cardSlot = state.slot;
  state.sel = d;
  render();
  renderDetail();
}


function wireChips(id, key) {
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const set = filters[key];
    if (b.dataset.k === "any") set.clear();
    else if (set.has(b.dataset.k)) set.delete(b.dataset.k);
    else set.add(b.dataset.k);
    render();
    renderDetail();
  });
}
wireChips("partyChips", "party");
wireChips("genderChips", "gender");
wireChips("statusChips", "status");

document.getElementById("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.mode = b.dataset.mode; render();
});
document.getElementById("slotSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.slot = b.dataset.slot; render();
});
document.getElementById("lblSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.labels = b.dataset.lbl; render(); applyView();
});

document.addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") zoomCenter(1.5);
  else if (e.key === "-" || e.key === "_") zoomCenter(1 / 1.5);
  else if (e.key === "0") { view = { k: 1, x: 0, y: 0 }; applyView(); }
  else if (e.key === "Escape" && state.sel != null) select(null);
});

document.getElementById("ripples").innerHTML =
  `<defs><path id="coastLine" d="${COAST}"/></defs>` +
  RIPPLE_PX.map((_, i) => RIPPLE_PX.length - 1 - i).map(i =>
    `<use href="#coastLine" class="rl" data-i="${i}" stroke-opacity="${RIPPLE_OP[i]}"/>` +
    `<use href="#coastLine" class="rp" data-i="${i}"/>`).join("");
buildWheel();
render();
renderDetail();
applyView();
</script>
</body>
</html>
